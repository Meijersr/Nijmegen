<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Op Historische Reis door Nijmegen</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Georgia', serif;
      background: #1a1008;
      color: #2c1a00;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── HEADER ── */
    header {
      background: linear-gradient(135deg, #2c1a00 0%, #5a3010 100%);
      color: #f5e6c8;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      box-shadow: 0 2px 8px rgba(0,0,0,0.5);
      z-index: 1000;
    }

    header h1 {
      font-size: 1.2rem;
      letter-spacing: 0.04em;
      font-style: italic;
    }

    header .subtitle {
      font-size: 0.7rem;
      opacity: 0.75;
      margin-top: 2px;
      font-style: normal;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .legend {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 0.68rem;
      color: #f5e6c8;
      font-family: sans-serif;
    }

    .legend-dot {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.4);
      flex-shrink: 0;
    }

    /* ── LAYOUT ── */
    .main {
      display: flex;
      flex: 1;
      overflow: hidden;
      position: relative;
    }

    #map {
      flex: 1;
      height: 100%;
    }

    /* ── PANEL (desktop) ── */
    #panel {
      width: 380px;
      flex-shrink: 0;
      background: #fdf6e8;
      border-left: 3px solid #8b5e2a;
      overflow-y: auto;
      position: relative;
      display: flex;
      flex-direction: column;
    }

    /* ── PANEL (mobile: hidden overlay) ── */
    @media (max-width: 700px) {
      #panel {
        position: absolute;
        top: 0; right: 0; bottom: 0;
        width: 100%;
        max-width: 100%;
        border-left: none;
        border-top: 3px solid #8b5e2a;
        transform: translateX(100%);
        transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        z-index: 500;
        box-shadow: -6px 0 24px rgba(0,0,0,0.35);
      }

      #panel.panel-open {
        transform: translateX(0);
      }
    }

    /* ── PANEL CONTENT ── */
    .panel-close {
      position: absolute;
      top: 12px;
      right: 12px;
      background: #8b5e2a;
      color: white;
      border: none;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
      line-height: 1;
      flex-shrink: 0;
    }
    .panel-close:hover { background: #5a3010; }

    .panel-header {
      padding: 16px 44px 14px 18px;
      border-bottom: 2px solid #d4a855;
      background: linear-gradient(to bottom, #fdf0d0, #fdf6e8);
      flex-shrink: 0;
    }

    .panel-number {
      font-size: 0.68rem;
      font-family: sans-serif;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: #8b5e2a;
      margin-bottom: 4px;
    }

    .panel-cat-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 0.67rem;
      font-family: sans-serif;
      color: white;
      margin-bottom: 8px;
    }

    .panel-title {
      font-size: 1.25rem;
      font-weight: bold;
      color: #2c1a00;
      line-height: 1.3;
    }

    .panel-body {
      padding: 16px 18px 28px;
    }

    .panel-image {
      width: 100%;
      max-height: 200px;
      object-fit: cover;
      border-radius: 4px;
      margin-bottom: 6px;
      border: 1px solid #d4a855;
      display: block;
    }

    .panel-image-caption {
      font-size: 0.7rem;
      color: #7a5a30;
      text-align: center;
      margin-bottom: 14px;
      font-style: italic;
    }

    .panel-text {
      font-size: 0.88rem;
      line-height: 1.65;
      color: #2c1a00;
    }
    .panel-text p { margin-bottom: 10px; }
    .panel-text p:last-child { margin-bottom: 0; }

    .panel-fun-fact {
      margin-top: 14px;
      background: #fff8e6;
      border-left: 3px solid #d4a855;
      padding: 10px 12px;
      border-radius: 0 4px 4px 0;
    }
    .panel-fun-fact-label {
      font-size: 0.66rem;
      font-family: sans-serif;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #8b5e2a;
      margin-bottom: 4px;
    }
    .panel-fun-fact p {
      font-size: 0.82rem;
      line-height: 1.55;
      color: #4a3010;
    }

    /* ── WELCOME ── */
    #welcome,
    #drawerContent {
      padding: 22px 18px;
    }
    #welcome h2,
    #drawerContent h2 {
      font-size: 1.3rem;
      color: #2c1a00;
      margin-bottom: 6px;
    }
    #welcome .quote,
    #drawerContent .quote {
      font-style: italic;
      color: #7a5a30;
      font-size: 0.85rem;
      border-left: 3px solid #d4a855;
      padding-left: 10px;
      margin: 12px 0;
      line-height: 1.5;
    }
    #welcome p,
    #drawerContent p {
      font-size: 0.86rem;
      line-height: 1.6;
      color: #3a2810;
      margin-bottom: 10px;
    }
    #welcome .stats,
    #drawerContent .stats {
      display: flex;
      gap: 10px;
      margin: 14px 0;
    }
    #welcome .stat,
    #drawerContent .stat {
      background: #fff8e6;
      border: 1px solid #d4a855;
      border-radius: 6px;
      padding: 8px 10px;
      text-align: center;
      flex: 1;
    }
    #welcome .stat-num,
    #drawerContent .stat-num {
      font-size: 1.3rem;
      font-weight: bold;
      color: #8b5e2a;
    }
    #welcome .stat-label,
    #drawerContent .stat-label {
      font-size: 0.66rem;
      font-family: sans-serif;
      color: #7a5a30;
      text-transform: uppercase;
      letter-spacing: 0.07em;
    }
    #welcome .legend-full,
    #drawerContent .legend-full { margin-top: 14px; }
    #welcome .legend-full h3,
    #drawerContent .legend-full h3 {
      font-size: 0.75rem;
      font-family: sans-serif;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #8b5e2a;
      margin-bottom: 8px;
    }
    #welcome .lfi,
    #drawerContent .lfi {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
      font-size: 0.8rem;
      color: #3a2810;
    }
    #welcome .lfd,
    #drawerContent .lfd {
      width: 13px; height: 13px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    #welcome .hist-section,
    #drawerContent .hist-section {
      margin-top: 14px;
      border-top: 1px solid #d4a855;
      padding-top: 12px;
    }
    #welcome .hist-section h3,
    #drawerContent .hist-section h3 {
      font-size: 0.92rem;
      color: #2c1a00;
      margin-bottom: 6px;
    }

    /* ── POPUPS ── */
    .leaflet-popup-content-wrapper {
      background: #fdf6e8;
      border: 2px solid #d4a855;
      border-radius: 6px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.3);
    }
    .leaflet-popup-tip { background: #d4a855; }
    .popup-inner {
      font-family: 'Georgia', serif;
      font-size: 0.8rem;
      color: #2c1a00;
    }
    .popup-inner strong {
      font-size: 0.88rem;
      display: block;
      margin-bottom: 2px;
    }
    .popup-inner .popup-cat {
      font-size: 0.65rem;
      font-family: sans-serif;
      color: #8b5e2a;
      text-transform: uppercase;
      letter-spacing: 0.07em;
    }
    .popup-inner .popup-hint {
      margin-top: 4px;
      font-size: 0.72rem;
      font-style: italic;
      color: #8b5e2a;
    }

    /* ── LOCATION MARKER ── */
    .loc-dot {
      width: 18px; height: 18px;
      border-radius: 50%;
      background: #2980b9;
      border: 3px solid white;
      box-shadow: 0 0 0 rgba(41,128,185,0.4);
      animation: loc-pulse 2s infinite;
    }
    @keyframes loc-pulse {
      0%   { box-shadow: 0 0 0 0 rgba(41,128,185,0.5); }
      70%  { box-shadow: 0 0 0 14px rgba(41,128,185,0); }
      100% { box-shadow: 0 0 0 0 rgba(41,128,185,0); }
    }

    /* ── LOCATE BUTTON ── */
    .locate-btn {
      background: white;
      border: none;
      width: 34px; height: 34px;
      cursor: pointer;
      font-size: 1.1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 4px;
      box-shadow: 0 1px 5px rgba(0,0,0,0.4);
      transition: background 0.15s;
    }
    .locate-btn:hover { background: #f4f4f4; }
    .locate-btn.active { background: #d0e8ff; }

    /* ── INFO DRAWER (mobile welcome) ── */
    .info-toggle {
      display: none; /* shown only on mobile */
      align-items: center;
      gap: 6px;
      background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.35);
      color: #f5e6c8;
      padding: 6px 12px;
      border-radius: 20px;
      cursor: pointer;
      font-family: sans-serif;
      font-size: 0.75rem;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .info-toggle:hover { background: rgba(255,255,255,0.25); }
    .info-arrow {
      display: inline-block;
      transition: transform 0.3s;
      font-style: normal;
    }
    .info-toggle.open .info-arrow { transform: rotate(180deg); }

    #infoDrawer {
      background: #fdf6e8;
      border-bottom: 2px solid #d4a855;
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.35s ease-out;
      flex-shrink: 0;
      z-index: 900;
      overflow-y: auto;
    }
    #infoDrawer.open { max-height: 65vh; }
    #infoDrawer .drawer-inner { padding: 18px 18px 22px; }

    /* ── MOBILE PERSISTENT LEGEND ── */
    .mobile-legend {
      display: none;
    }
    @media (max-width: 700px) {
      .info-toggle { display: flex; }
      .legend { display: none; }
      header h1 { font-size: 1rem; }

      .mobile-legend {
        display: block;
        position: absolute;
        bottom: 24px;
        left: 8px;
        z-index: 600;
        background: rgba(253,246,232,0.92);
        border: 1px solid #d4a855;
        border-radius: 6px;
        padding: 5px 7px;
        font-family: sans-serif;
        font-size: 0.62rem;
        color: #3a2810;
        pointer-events: none;
        box-shadow: 0 1px 5px rgba(0,0,0,0.2);
      }
      .mobile-legend .ml-item {
        display: flex;
        align-items: center;
        gap: 4px;
        margin-bottom: 3px;
        white-space: nowrap;
      }
      .mobile-legend .ml-item:last-child { margin-bottom: 0; }
      .mobile-legend .ml-dot {
        width: 9px; height: 9px;
        border-radius: 50%;
        flex-shrink: 0;
        border: 1px solid rgba(255,255,255,0.6);
      }
    }
  </style>
</head>
<body>

<header>
  <div>
    <h1>Op Historische Reis door Nijmegen</h1>
    <div class="subtitle">Stadswandeling — 29 stops + tips van Sab — ±2,5 km</div>
  </div>
  <div class="legend" id="headerLegend"></div>
  <button class="info-toggle" id="infoToggle" aria-expanded="false">
    Over de wandeling <em class="info-arrow">▼</em>
  </button>
</header>

<div id="infoDrawer" role="region" aria-label="Over de wandeling">
  <div class="drawer-inner" id="drawerContent"></div>
</div>

<div class="main">
  <div id="map"></div>

  <div id="mobileLegend" class="mobile-legend"></div>

  <div id="panel">
    <div id="welcome"></div>
    <div id="detail" style="display:none">
      <button class="panel-close" id="panelClose" title="Sluiten">✕</button>
      <div class="panel-header">
        <div class="panel-number" id="detailNumber"></div>
        <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px">
          <div class="panel-cat-badge" id="detailBadge" style="margin-bottom:0"></div>
          <div class="panel-cat-badge" id="detailSubcat" style="display:none;margin-bottom:0"></div>
          <div class="panel-cat-badge" id="detailPrice" style="display:none;margin-bottom:0;background:#555"></div>
        </div>
        <div class="panel-title" id="detailTitle"></div>
      </div>
      <div class="panel-body">
        <img id="detailImage" class="panel-image" src="" alt="" style="display:none" />
        <div id="detailImageCaption" class="panel-image-caption" style="display:none"></div>
        <div class="panel-text" id="detailText"></div>
        <div id="detailFunFact" class="panel-fun-fact" style="display:none">
          <div class="panel-fun-fact-label">Wist je dat…</div>
          <p id="detailFunFactText"></p>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
// ─── CATEGORIES ─────────────────────────────────────────────────────────────
const CATS = {
  monument:    { label: 'Historisch Monument', color: '#c0392b', emoji: '🏛️' },
  horeca:      { label: 'Horeca',              color: '#e67e22', emoji: '🍺' },
  kunst:       { label: 'Kunst & Cultuur',     color: '#8e44ad', emoji: '🎨' },
  herdenking:  { label: 'Herdenking',          color: '#7f8c8d', emoji: '🕊️' },
  park:        { label: 'Park & Natuur',       color: '#27ae60', emoji: '🌿' },
  geschiedenis:{ label: 'Geschiedenis',        color: '#2980b9', emoji: '📖' },
  tips:        { label: 'Tips van Sab', color: '#c2185b', markerColor: '#f48fb1', emoji: '⭐' },
};

const SUBCATS = {
  ontbijt: { label: '🍳 Ontbijt',  bg: '#fff3e0', fg: '#e65100' },
  lunch:   { label: '🥗 Lunch',    bg: '#e8f5e9', fg: '#2e7d32' },
  cafe:    { label: '☕ Café',      bg: '#efebe9', fg: '#4e342e' },
  diner:   { label: '🍽️ Diner',   bg: '#f3e5f5', fg: '#6a1b9a' },
};

// ─── WIKIPEDIA IMAGE LOADER ──────────────────────────────────────────────────
const _imgCache = {};
async function fetchWikiThumb(article, lang = 'nl') {
  const key = lang + ':' + article;
  if (_imgCache[key] !== undefined) return _imgCache[key];
  _imgCache[key] = null; // mark as pending so we don't double-fetch
  try {
    const r = await fetch(
      `https://${lang}.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(article)}`
    );
    const d = await r.json();
    _imgCache[key] = d.thumbnail?.source ?? null;
  } catch { /* stay null */ }
  return _imgCache[key];
}

// ─── HIGHLIGHTS ─────────────────────────────────────────────────────────────
const highlights = [
  {
    id: 1,
    title: 'De Blauwe Steen',
    cat: 'monument',
    lat: 51.8434, lng: 5.8658,
    wikiArticle: 'Grote_Markt_(Nijmegen)', wikiLang: 'nl',
    imageCaption: 'De Grote Markt, Nijmegen.',
    text: `<p>Midden op de Grote Markt ligt de Blauwe Steen — een onopvallend maar historisch geladen tegel op het kruispunt van de vier oudste wijken van Nijmegen. Al sinds 1522 was dit de gerechtsplaats van de stad. Hier werden veroordeelden gestraft, variërend van geseling tot het afhakken van ledenmaten. Ook ketterse boeken gingen hier in vlammen op.</p>
<p>De steen die je nu ziet is niet de originele — hij is meerdere keren vervangen, voor het laatst in 1976. Carnavalsvereniging De Blauwe Schuit schonk de stad toen een nieuwe steen. Sindsdien wordt carnaval hier officieel geopend. Een plek van ernst veranderde zo in een plek van feest.</p>`,
    funFact: 'Elk jaar slaat hier de carnavalsvereniging het eerste vat bier aan om het carnavalsseizoen officieel te openen!'
  },
  {
    id: 2,
    title: 'Café de Blaauwe Hand',
    cat: 'horeca',
    lat: 51.8432, lng: 5.8663,
    image: null,
    text: `<p>Café de Blaauwe Hand is het <em>oudste bestaande café van Nijmegen</em>, opgericht in 1542. De naam verwijst naar de ververs die in de Laeckenhal werkten — het textielhandelscentrum dat zich vroeger op deze plek bevond. Ze verfden met indigoblauw pigment, dat zo hardnekkig was dat ze er blauwe handen van kregen.</p>
<p>De Laeckenhal strekte zich 54 meter lang uit over de volle breedte van de huizenrij naast de kerkboog. Na een dag hard werken kwamen de blauwhandige ververs hier bijkomen — en zo kreeg het café zijn naam.</p>`,
    funFact: 'Het café bestaat al meer dan 480 jaar. Als de muren konden praten…'
  },
  {
    id: 3,
    title: 'De Waagh',
    cat: 'monument',
    lat: 51.8437, lng: 5.8661,
    wikiArticle: 'Waag_(Nijmegen)', wikiLang: 'nl',
    imageCaption: 'De Waagh op de Grote Markt, gebouwd in 1612.',
    text: `<p>Dit fraaie gebouw uit 1612 diende als de officiële weegplaats van de stad. In de rechtervleugel hing de weegschaal voor koopwaar. In de linkervleugel was het vleeshuis ondergebracht: dieren konden ter plekke worden geslacht en direct op de markt worden verkocht.</p>
<p>Had de slager zijn vlees na twee dagen nog niet kwijt? Dan werd het buiten de stadsmuren verkocht aan armen. Voedselverspilling bestond al in de zeventiende eeuw — en er was ook al een oplossing voor.</p>`,
    funFact: null
  },
  {
    id: 4,
    title: 'Het HEMA-gebouw',
    cat: 'kunst',
    lat: 51.8433, lng: 5.8655,
    image: null,
    text: `<p>Niet het meest geliefd gebouw van Nijmegen — studenten grappen dat de HEMA de beste plek is om te lunchen, "want van hieruit zie je de HEMA niet." Toch was dit gebouw in zijn tijd architectonisch baanbrekend.</p>
<p>Ontworpen in 1958 door de Amsterdamse architect Abraham Elzas, maakte het gebruik van vernieuwende materialen als glas, beton en aluminium. En de glazen gevel spiegelt de historische gebouwen er schuin tegenover — als een knipoog naar het verleden.</p>`,
    funFact: 'De weerspiegeling van de oude gevels in het glas was geen toeval, maar een bewuste keuze van de architect om het historische karakter van de plek te eren.'
  },
  {
    id: 5,
    title: 'Mariken van Nimwegen',
    cat: 'kunst',
    lat: 51.8435, lng: 5.8660,
    wikiArticle: 'Mariken_van_Nimwegen', wikiLang: 'nl',
    imageCaption: 'Mariken van Nimwegen — middeleeuws toneelspel.',
    text: `<p>Op de Grote Markt staan twee beelden: Mariken van Nieumeghen en de duivel Moenen. Mariken is de hoofdpersoon uit een middeleeuws toneelstuk — het verhaal van een meisje dat op haar dieptepunt zowel God als de duivel aanroept om hulp. Moenen, de duivel, verschijnt als eerste en neemt haar mee naar Antwerpen voor zeven jaar zondige avonturen.</p>
<p>Als Mariken spijt krijgt en terugkeert naar Nijmegen, raakt Moenen zo razend dat hij haar van grote hoogte op straat gooit. Wonderbaarlijk genoeg overleeft ze het en mag ze toetreden tot een klooster om boete te doen. Het is een verhaal over zonde, vergiffenis en een tweede kans.</p>
<p>Let op: het beeld van Moenen staat met zijn rug naar de kerk gekeerd — een toepassig detail.</p>`,
    funFact: 'Het beeld van Mariken was een cadeau van de V&D aan de stad, nadat hun pand in de oorlog was verwoest. In de Marikenstraat zit overigens een spellenspeciaalzaak die "Moenen & Mariken" heet!'

  {
    id: 6,
    title: 'Het Stadhuis',

    lat: 51.8440, lng: 5.8650,
    wikiArticle: 'Stadhuis_van_Nijmegen', wikiLang: 'nl',
    imageCaption: 'Het Stadhuis van Nijmegen, gebouwd uit drie 16e-eeuwse woonhuizen.',
    text: `<p>In 1554 werden drie woonhuizen samengevoegd tot één stadhuis. Onder de dakgoot zie je medaillons met de zeven hoofddeugden: Hoop, Liefde, Geloof, Moed, Voorzichtigheid, Eendracht en Rechtvaardigheid. Gevelbeelden van onder anderen Karel de Grote, Frederik Barbarossa en Trajanus herinneren aan Nijmegens glorieuze verleden als keizerstad.</p>
<p>Hier werd de <strong>Vrede van Nijmegen</strong> getekend. Van 1676 tot 1679 was dit stadhuis het centrum van de Europese diplomatie, toen gezanten uit Nederland, Frankrijk, Engeland, Rome en Zweden de Hollandse Oorlog beëindigden.</p>
<p>Minder glorieus: in de kelders bevond zich vroeger een gevangenis en folterplaats. Tijdens de Plooierijen van 1702 werden vijf mannen aan de ramen van de eerste verdieping opgehangen als afschrikking.</p>`,

  {
    id: 7,
    title: 'Het Bombardement van Nijmegen',
    cat: 'herdenking',

function makeIcon(cat, num) {
  const isTip = cat === 'tips';
  const color = isTip ? (CATS[cat].markerColor || CATS[cat].color) : CATS[cat].color;
  const size  = isTip ? 20 : 28;
  const half  = size / 2;
  const fs    = isTip ? 7 : 9;
  return L.divIcon({
    html: `<div style="background:${color};width:${size}px;height:${size}px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:2px solid rgba(255,255,255,0.85);box-shadow:0 2px 5px rgba(0,0,0,0.35);display:flex;align-items:center;justify-content:center"><span style="transform:rotate(45deg);color:white;font-size:${fs}px;font-weight:bold;font-family:sans-serif;margin-top:-1px">${num}</span></div>`,
    className: '',
    iconSize: [size, size],
    iconAnchor: [half, size],
    popupAnchor: [0, -(size + 2)],
  });
}

highlights.forEach(h => {
  L.marker([h.lat, h.lng], { icon: makeIcon(h.cat, h.id) })
    .addTo(map)
    .on('click', () => openDetail(h));
});

// ─── PANEL LOGIC ─────────────────────────────────────────────────────────────
const panel     = document.getElementById('panel');
const welcome   = document.getElementById('welcome');
const detail    = document.getElementById('detail');

function isMobile() { return window.innerWidth <= 700; }

function openDetail(h) {
  // Fill content
  const stopLabel = tourIds.has(h.id) ? `Stop ${h.id} van 29` : (h.cat === 'tips' ? 'Tip van Sab' : 'Natuurwandeling');
  document.getElementById('detailNumber').textContent = stopLabel;

  const badge = document.getElementById('detailBadge');
  badge.textContent = `${CATS[h.cat].emoji} ${CATS[h.cat].label}`;
  badge.style.background = CATS[h.cat].color;

  const subcat = document.getElementById('detailSubcat');
  const priceEl = document.getElementById('detailPrice');
  if (h.subcat && SUBCATS[h.subcat]) {
    const sc = SUBCATS[h.subcat];
    subcat.textContent = sc.label;
    subcat.style.background = sc.bg;
    subcat.style.color = sc.fg;
    subcat.style.display = 'inline-block';
  } else {
    subcat.style.display = 'none';
  }
  if (h.price) {
    priceEl.textContent = h.price;
    priceEl.style.display = 'inline-block';
  } else {
    priceEl.style.display = 'none';
  }

  document.getElementById('detailTitle').textContent = h.title;

  const img    = document.getElementById('detailImage');
  const imgCap = document.getElementById('detailImageCaption');

  // Hide while (potentially) loading
  img.style.display = 'none';
  imgCap.style.display = 'none';

  if (h.wikiArticle) {
    fetchWikiThumb(h.wikiArticle, h.wikiLang || 'nl').then(src => {
      // Guard: user may have opened a different panel while this was fetching
      if (document.getElementById('detailTitle').textContent !== h.title) return;
      if (src) {
        img.src = src;
        img.alt = h.title;
        img.style.display = 'block';
        if (h.imageCaption) {
          imgCap.textContent = h.imageCaption;
          imgCap.style.display = 'block';
        }
      }
    });
  }

  document.getElementById('detailText').innerHTML = h.text;

  const ff  = document.getElementById('detailFunFact');
  const fft = document.getElementById('detailFunFactText');
  if (h.funFact) { fft.textContent = h.funFact; ff.style.display = 'block'; }
  else           { ff.style.display = 'none'; }

  // Show detail, hide welcome
  welcome.style.display = 'none';
  detail.style.display  = 'block';
  panel.scrollTop = 0;

  // On mobile: slide panel in
  panel.classList.add('panel-open');

  map.panTo([h.lat, h.lng], { animate: true });
}

function closeDetail() {
  detail.style.display  = 'none';
  welcome.style.display = 'block';
  panel.scrollTop = 0;

  // On mobile: slide panel away
  if (isMobile()) {
    panel.classList.remove('panel-open');
  }
}

document.getElementById('panelClose').addEventListener('click', closeDetail);

// ─── LIVE LOCATIE ─────────────────────────────────────────────────────────────
let locMarker = null;
let locCircle = null;
let tracking  = false;

const LocBtn = L.Control.extend({
  options: { position: 'topleft' },
  onAdd() {
    const btn = L.DomUtil.create('button', 'locate-btn leaflet-bar');
    btn.innerHTML = '📍';
    btn.title = 'Toon mijn locatie';
    L.DomEvent.disableClickPropagation(btn);
    btn.onclick = () => {
      if (!tracking) {
        tracking = true;
        btn.classList.add('active');
        btn.title = 'Stop locatie';
        map.locate({ watch: true, enableHighAccuracy: true });
      } else {
        tracking = false;
        btn.classList.remove('active');
        btn.title = 'Toon mijn locatie';
        map.stopLocate();
        if (locMarker) { map.removeLayer(locMarker); locMarker = null; }
        if (locCircle) { map.removeLayer(locCircle); locCircle = null; }
      }
    };
    return btn;
  }
});
new LocBtn().addTo(map);

map.on('locationfound', e => {
  if (locCircle) map.removeLayer(locCircle);
  if (locMarker) map.removeLayer(locMarker);

  if (e.accuracy < 2000) {
    locCircle = L.circle(e.latlng, {
      radius: e.accuracy / 2,
      color: '#2980b9', fillColor: '#2980b9',
      fillOpacity: 0.1, weight: 1,
    }).addTo(map);
  }

  locMarker = L.marker(e.latlng, {
    icon: L.divIcon({
      className: '',
      html: '<div class="loc-dot"></div>',
      iconSize: [18, 18],
      iconAnchor: [9, 9],
    }),
    zIndexOffset: 1000,
  }).addTo(map);
});

map.on('locationerror', e => {
  tracking = false;
  document.querySelector('.locate-btn').classList.remove('active');
  alert('Locatie niet beschikbaar: ' + e.message);
});

// ─── INFO DRAWER (mobile welcome toggle) ─────────────────────────────────────
const infoToggle = document.getElementById('infoToggle');
const infoDrawer = document.getElementById('infoDrawer');

infoToggle.addEventListener('click', () => {
  const isOpen = infoDrawer.classList.toggle('open');
  infoToggle.classList.toggle('open', isOpen);
  infoToggle.setAttribute('aria-expanded', String(isOpen));
  // Close the detail panel if open, to avoid confusion
  if (isOpen) {
    panel.classList.remove('panel-open');
  }
});

// Clicking elsewhere on the map closes the drawer
document.getElementById('map').addEventListener('click', () => {
  if (infoDrawer.classList.contains('open')) {
    infoDrawer.classList.remove('open');
    infoToggle.classList.remove('open');
    infoToggle.setAttribute('aria-expanded', 'false');
  }
});
