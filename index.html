<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Op Historische Reis door Nijmegen</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Georgia', serif;
      background: #1a1008;
      color: #2c1a00;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      background: linear-gradient(135deg, #2c1a00 0%, #5a3010 100%);
      color: #f5e6c8;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      box-shadow: 0 2px 8px rgba(0,0,0,0.5);
      z-index: 1000;
    }

    header h1 {
      font-size: 1.3rem;
      letter-spacing: 0.05em;
      font-style: italic;
    }

    header .subtitle {
      font-size: 0.75rem;
      opacity: 0.75;
      margin-top: 2px;
      font-style: normal;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .legend {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 0.72rem;
      color: #f5e6c8;
      opacity: 0.9;
      font-family: sans-serif;
    }

    .legend-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.5);
      flex-shrink: 0;
    }

    .main {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    #map {
      flex: 1;
      height: 100%;
    }

    /* Panel */
    #panel {
      width: 380px;
      flex-shrink: 0;
      background: #fdf6e8;
      border-left: 3px solid #8b5e2a;
      overflow-y: auto;
      transition: transform 0.3s ease;
      position: relative;
    }

    #panel.hidden {
      transform: translateX(100%);
      width: 0;
      border: none;
    }

    .panel-close {
      position: absolute;
      top: 12px;
      right: 12px;
      background: #8b5e2a;
      color: white;
      border: none;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
      line-height: 1;
    }

    .panel-close:hover { background: #5a3010; }

    .panel-header {
      padding: 18px 42px 14px 18px;
      border-bottom: 2px solid #d4a855;
      background: linear-gradient(to bottom, #fdf0d0, #fdf6e8);
    }

    .panel-number {
      font-size: 0.7rem;
      font-family: sans-serif;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: #8b5e2a;
      margin-bottom: 4px;
    }

    .panel-cat-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 0.68rem;
      font-family: sans-serif;
      color: white;
      margin-bottom: 8px;
    }

    .panel-title {
      font-size: 1.3rem;
      font-weight: bold;
      color: #2c1a00;
      line-height: 1.3;
    }

    .panel-body {
      padding: 16px 18px 24px;
    }

    .panel-image {
      width: 100%;
      max-height: 200px;
      object-fit: cover;
      border-radius: 4px;
      margin-bottom: 14px;
      border: 1px solid #d4a855;
    }

    .panel-image-caption {
      font-size: 0.72rem;
      color: #7a5a30;
      text-align: center;
      margin-top: -10px;
      margin-bottom: 14px;
      font-style: italic;
    }

    .panel-text {
      font-size: 0.9rem;
      line-height: 1.65;
      color: #2c1a00;
    }

    .panel-text p { margin-bottom: 10px; }
    .panel-text p:last-child { margin-bottom: 0; }

    .panel-fun-fact {
      margin-top: 14px;
      background: #fff8e6;
      border-left: 3px solid #d4a855;
      padding: 10px 12px;
      border-radius: 0 4px 4px 0;
    }

    .panel-fun-fact-label {
      font-size: 0.68rem;
      font-family: sans-serif;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #8b5e2a;
      margin-bottom: 4px;
    }

    .panel-fun-fact p {
      font-size: 0.83rem;
      line-height: 1.55;
      color: #4a3010;
    }

    /* Welcome panel */
    #welcome {
      padding: 24px 20px;
    }

    #welcome h2 {
      font-size: 1.4rem;
      color: #2c1a00;
      margin-bottom: 6px;
    }

    #welcome .quote {
      font-style: italic;
      color: #7a5a30;
      font-size: 0.88rem;
      border-left: 3px solid #d4a855;
      padding-left: 10px;
      margin: 14px 0;
      line-height: 1.5;
    }

    #welcome p {
      font-size: 0.88rem;
      line-height: 1.6;
      color: #3a2810;
      margin-bottom: 10px;
    }

    #welcome .stats {
      display: flex;
      gap: 12px;
      margin: 16px 0;
      flex-wrap: wrap;
    }

    #welcome .stat {
      background: #fff8e6;
      border: 1px solid #d4a855;
      border-radius: 6px;
      padding: 8px 12px;
      text-align: center;
      flex: 1;
      min-width: 80px;
    }

    #welcome .stat-num {
      font-size: 1.4rem;
      font-weight: bold;
      color: #8b5e2a;
    }

    #welcome .stat-label {
      font-size: 0.7rem;
      font-family: sans-serif;
      color: #7a5a30;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    #welcome .legend-full {
      margin-top: 14px;
    }

    #welcome .legend-full h3 {
      font-size: 0.8rem;
      font-family: sans-serif;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #8b5e2a;
      margin-bottom: 8px;
    }

    #welcome .legend-full-item {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
      font-size: 0.82rem;
      color: #3a2810;
    }

    #welcome .legend-full-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    /* Custom marker styles */
    .marker-pin {
      width: 26px;
      height: 26px;
      border-radius: 50% 50% 50% 0;
      transform: rotate(-45deg);
      border: 2px solid rgba(255,255,255,0.8);
      box-shadow: 0 2px 6px rgba(0,0,0,0.4);
      cursor: pointer;
    }

    .marker-pin .num {
      transform: rotate(45deg);
      color: white;
      font-size: 9px;
      font-weight: bold;
      font-family: sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      margin-top: -2px;
    }

    .leaflet-popup-content-wrapper {
      background: #fdf6e8;
      border: 2px solid #d4a855;
      border-radius: 6px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.3);
    }

    .leaflet-popup-tip { background: #d4a855; }

    .popup-inner {
      font-family: 'Georgia', serif;
      font-size: 0.82rem;
      color: #2c1a00;
    }

    .popup-inner strong {
      font-size: 0.9rem;
      display: block;
      margin-bottom: 3px;
    }

    .popup-inner .popup-cat {
      font-size: 0.68rem;
      font-family: sans-serif;
      color: #8b5e2a;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .popup-inner .popup-hint {
      margin-top: 5px;
      font-size: 0.75rem;
      font-style: italic;
      color: #8b5e2a;
    }

    @media (max-width: 700px) {
      #panel {
        position: absolute;
        right: 0;
        top: 0;
        bottom: 0;
        z-index: 500;
        width: 90vw;
      }

      .legend { display: none; }
      header h1 { font-size: 1rem; }
    }
  </style>
</head>
<body>

<header>
  <div>
    <h1>Op Historische Reis door Nijmegen</h1>
    <div class="subtitle">Stadswandeling — 27 highlights — ±2,5 km</div>
  </div>
  <div class="legend" id="headerLegend"></div>
</header>

<div class="main">
  <div id="map"></div>
  <div id="panel">
    <div id="welcome"></div>
    <div id="detail" style="display:none">
      <button class="panel-close" id="panelClose" title="Sluiten">✕</button>
      <div class="panel-header">

        <div class="panel-cat-badge" id="detailBadge"></div>
        <div class="panel-title" id="detailTitle"></div>
      </div>
      <div class="panel-body">
        <img id="detailImage" class="panel-image" src="" alt="" style="display:none" />
        <div id="detailImageCaption" class="panel-image-caption" style="display:none"></div>
        <div class="panel-text" id="detailText"></div>
        <div id="detailFunFact" class="panel-fun-fact" style="display:none">
          <div class="panel-fun-fact-label">Wist je dat…</div>
          <p id="detailFunFactText"></p>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
// ─── CATEGORIES ─────────────────────────────────────────────────────────────
const CATS = {
  monument:    { label: 'Historisch Monument', color: '#c0392b', emoji: '🏛️' },
  horeca:      { label: 'Horeca',              color: '#e67e22', emoji: '🍺' },
  kunst:       { label: 'Kunst & Cultuur',     color: '#8e44ad', emoji: '🎨' },
  herdenking:  { label: 'Herdenking',          color: '#7f8c8d', emoji: '🕊️' },
  park:        { label: 'Park & Natuur',       color: '#27ae60', emoji: '🌿' },
  geschiedenis:{ label: 'Geschiedenis',        color: '#2980b9', emoji: '📖' },
};

// ─── HIGHLIGHTS ─────────────────────────────────────────────────────────────
const highlights = [
  {
    id: 1,
    title: 'De Blauwe Steen',
    cat: 'monument',
    lat: 51.8434, lng: 5.8658,
    image: 'https://upload.wikimedia.org/wikipedia/commons/thumb/5/5e/Grote_Markt_Nijmegen.jpg/1280px-Grote_Markt_Nijmegen.jpg',
    imageCaption: 'De Grote Markt met de Blauwe Steen, Nijmegen.',
    text: `<p>Midden op de Grote Markt ligt de Blauwe Steen — een onopvallend maar historisch geladen tegel op het kruispunt van de vier oudste wijken van Nijmegen. Al sinds 1522 was dit de gerechtsplaats van de stad. Hier werden veroordeelden gestraft, variërend van geseling tot het afhakken van ledenmaten. Ook ketterse boeken gingen hier in vlammen op.</p>
<p>De steen die je nu ziet is niet de originele — hij is meerdere keren vervangen, voor het laatst in 1976. Carnavalsvereniging De Blauwe Schuit schonk de stad toen een nieuwe steen. Sindsdien wordt carnaval hier officieel geopend. Een plek van ernst is zo veranderd in een plek van feest.</p>`,
    funFact: 'Elk jaar slaat hier de carnavalsvereniging het eerste vat bier aan om het carnavalsseizoen officieel te openen!'
  },
  {
    id: 2,
    title: 'Café de Blaauwe Hand',
    cat: 'horeca',
    lat: 51.8432, lng: 5.8663,
    image: null,
    text: `<p>Café de Blaauwe Hand is het <em>oudste bestaande café van Nijmegen</em>, opgericht in 1542. De naam verwijst naar de ververs die in de Laeckenhal werkten — het textielhandelscentrum dat zich vroeger op deze plek bevond. Ze verfden met indigoblauw pigment, dat zo hardnekkig was dat ze er blauwe handen van kregen.</p>
<p>De Laeckenhal strekte zich 54 meter lang uit over de volle breedte van de huizenrij naast de kerkboog. Na een dag hard werken kwamen de blauwhandige ververs hier bijkomen — en zo kreeg het café zijn naam.</p>`,
    funFact: 'Het café bestaat al meer dan 480 jaar. Als de muren konden praten...'
  },
  {
    id: 3,
    title: 'De Waagh',
    cat: 'monument',
    lat: 51.8437, lng: 5.8661,
    image: 'https://upload.wikimedia.org/wikipedia/commons/thumb/c/c2/Waag_Nijmegen.jpg/1280px-Waag_Nijmegen.jpg',
    imageCaption: 'De Waagh op de Grote Markt, gebouwd in 1612.',
    text: `<p>Dit fraaie gebouw uit 1612 diende als de officiële weegplaats van de stad. In de rechtervleugel hing de weegschaal voor koopwaar. In de linkervleugel was het vleeshuis ondergebracht: dieren konden ter plekke worden geslacht en direct op de markt worden verkocht.</p>
<p>Had de slager zijn vlees na twee dagen nog niet kwijt? Dan werd het buiten de stadsmuren verkocht aan armen. Voedselverspilling bestond al in de zeventiende eeuw — en er was ook al een oplossing voor.</p>`,
    funFact: 'Het woord "waagh" (of waag) leeft voort in het Nederlandse woord "wagen" — je waagt iets op de weegschaal!'
  },
  {
    id: 4,
    title: 'Het HEMA-gebouw',
    cat: 'kunst',
    lat: 51.8433, lng: 5.8655,
    image: null,
    text: `<p>Niet het meest geliefd gebouw van Nijmegen — studenten grappen dat de HEMA de beste plek is om te lunchen, "want van hieruit zie je de HEMA niet." Toch was dit gebouw in zijn tijd architectonisch baanbrekend.</p>
<p>Ontworpen in 1958 door de Amsterdamse architect Abraham Elzas, maakte het gebruik van vernieuwende materialen als glas, beton en aluminium. De glazen deuren stralen openheid en transparantie uit. De zwevende etalagekasten zijn een kenmerk van de wederopbouwarchitectuur. En de glazen gevel spiegelt de historische gebouwen er schuin tegenover — als een knipoog naar het verleden.</p>`,
    funFact: 'De weerspiegeling van de oude gevels in het glas was geen toeval, maar een bewuste keuze van de architect om het historische karakter van de plek te eren.'
  },
  {
    id: 5,
    title: 'Mariken van Nimwegen',
    cat: 'kunst',
    lat: 51.8435, lng: 5.8660,
    image: 'https://upload.wikimedia.org/wikipedia/commons/thumb/8/8d/Mariken_van_Nieumeghen_standbeeld.jpg/640px-Mariken_van_Nieumeghen_standbeeld.jpg',
    imageCaption: 'Het standbeeld van Mariken van Nimwegen op de Grote Markt.',
    text: `<p>Op de Grote Markt staan twee beelden: Mariken van Nieumeghen en de duivel Moenen. Mariken is de hoofdpersoon uit een middeleeuws toneelstuk — het verhaal van een meisje dat op haar dieptepunt zowel God als de duivel aanroept om hulp. Moenen, de duivel, verschijnt als eerste en neemt haar mee naar Antwerpen voor zeven jaar zondige avonturen.</p>
<p>Als Mariken spijt krijgt en terugkeert naar Nijmegen, raakt Moenen zo razend dat hij haar van grote hoogte op straat gooit. Wonderbaarlijk genoeg overleeft ze het en mag ze toetreden tot een klooster om boete te doen. Het is een verhaal over zonde, vergiffenis en hoe je een tweede kans kunt grijpen.</p>
<p>Let op: het beeld van Moenen staat met zijn rug naar de kerk gekeerd — een toepassig detail.</p>`,
    funFact: 'Het beeld van Mariken was een cadeau van de V&D aan de stad, nadat hun pand in de oorlog was verwoest. In de Marikenstraat zit overigens een spellenspeciaalzaak die "Moenen & Mariken" heet!'
  },
  {
    id: 6,
    title: 'Het Stadhuis',
    cat: 'monument',
    lat: 51.8440, lng: 5.8650,
    image: 'https://upload.wikimedia.org/wikipedia/commons/thumb/4/4f/Stadhuis_Nijmegen.jpg/1280px-Stadhuis_Nijmegen.jpg',
    imageCaption: 'Het Stadhuis van Nijmegen, gebouwd uit drie 16e-eeuwse woonhuizen.',
    text: `<p>In 1554 werden drie woonhuizen samengevoegd tot één stadhuis. Onder de dakgoot zie je medaillons met de zeven hoofddeugden: Hoop, Liefde, Geloof, Moed, Voorzichtigheid, Eendracht en Rechtvaardigheid. Gevelbeelden van onder anderen Karel de Grote, Frederik Barbarossa en Trajanus herinneren aan Nijmegens glorieuze verleden als keizerstad.</p>
<p>Maar het indrukwekkendste feit: hier werd de <strong>Vrede van Nijmegen</strong> getekend. Van 1676 tot 1679 was dit stadhuis het centrum van de Europese diplomatie, toen gezanten uit Nederland, Frankrijk, Engeland, Rome en Zweden de Hollandse Oorlog beëindigden.</p>
<p>Minder glorieus: in de kelders bevond zich vroeger een gevangenis en folterplaats. Tijdens de Plooierijen van 1702 werden vijf mannen aan de ramen van de eerste verdieping opgehangen als afschrikking.</p>`,
    funFact: 'De introtune van het Eurovisiesongfestival — "Te Deum" van Charpentier — is geschreven ter gelegenheid van de Vrede van Nijmegen in 1679!'
  },
  {
    id: 7,
    title: 'Het Bombardement van Nijmegen',
    cat: 'herdenking',
    lat: 51.8441, lng: 5.8647,
    image: null,
    text: `<p>Op 22 februari 1944 werd een groot deel van het centrum van Nijmegen verwoest — niet door de Duitsers, maar door geallieerde bommenwerpers. Zo'n 800 mensen kwamen om het leven. Lang werd het afdeed als een "vergissingsbombardement", maar recenter onderzoek wijst op een andere verklaring.</p>
<p>Vermoedelijk waren de vliegers op weg naar Duitsland, maar konden ze hun doel vanwege bewolking niet bereiken. Met nog geladen bommenwerpers en de opdracht terug te keren, werden ze gestuurd op zoek naar "gelegenheidsdoelen". Ze dachten waarschijnlijk nog boven Duits grondgebied te vliegen.</p>
<p>Het drama was extra pijnlijk: het luchtalarm had al geklonken, mensen waren naar binnen gevlucht — maar toen het alarm stopte, gingen ze de straat op. De tweede aanvliegroute, waarbij de bommen werden gedropt, ging zonder alarm.</p>`,
    funFact: 'In tegenstelling tot het bombardement op Rotterdam, kreeg het bombardement op Nijmegen lange tijd nauwelijks aandacht in de Nederlandse geschiedschrijving.'
  },
  {
    id: 8,
    title: 'De Schommel — Monument voor Jeugdslachtoffers',
    cat: 'herdenking',
    lat: 51.8443, lng: 5.8645,
    image: null,
    text: `<p>Dit schommelmonument, opgericht in 2000, staat ter nagedachtenis aan de kinderen die omkwamen bij het bombardement van 1944. Precies op deze plek stond destijds de speelplaats van de montessorischool Saint Louis. De school werd direct geraakt: 24 jonge kinderen en 8 onderwijzende zusters verloren het leven.</p>
<p>De kastanjebomen bij het monument stonden al in de tuin van de school — stille getuigen van wat hier gebeurde. De schommel als symbool: een onbezonnen ding, dat stil bleef staan op een dag die nooit vergeten wordt.</p>`,
    funFact: null
  },
  {

<p>De route volgt exact de grens van het gebied dat op 22 februari 1944 werd verwoest. Loop je langs de plaatjes, dan wandel je letterlijk over de grens tussen wat gespaard bleef en wat verloren ging.</p>`,
    funFact: 'De plaatjes zijn geïnspireerd op de Stolpersteine (struikelstenen) die door heel Europa worden geplaatst ter herdenking van slachtoffers van de nazi-vervolging.'
  },
  {
    id: 10,
    title: 'Kelfkensbos',
    cat: 'park',
    lat: 51.8457, lng: 5.8655,
    image: null,
    text: `<p>Het plein voor Museum het Valkhof heet niet het Valkhofplein, maar <em>Kelfkensbos</em> — vernoemd naar het bos dat hier ooit stond. "Kelfke" is Nijmeegs dialect voor kalfje, dus eigenlijk: Kalverenbos. De bomen werden in de eerste helft van de negentiende eeuw gekapt.</p>
<p>Bij opgravingen in 1980 werden hier twee delen van een Romeinse <em>godenpijler</em> gevonden — de oudste stenen vondst van Nederland, uit het jaar 17 na Christus.</p>`,
    funFact: null
  },
  {
    id: 11,
    title: 'De Godenpijler (Noviomagus)',
    cat: 'kunst',
    lat: 51.8456, lng: 5.8652,
    image: 'https://upload.wikimedia.org/wikipedia/commons/thumb/9/96/Godenzuil_Nijmegen_04.jpg/640px-Godenzuil_Nijmegen_04.jpg',
    imageCaption: 'Het kunstwerk Noviomagus op het Kelfkensbos, gebaseerd op de Godenpijler.',
    text: `<p>De Godenpijler is de oudste stenen vondst van Nederland: hij dateert uit het jaar 17 na Christus. Daarmee is hij het bewijs dat Nijmegen de oudste stad van Nederland is. De zuil toont keizer Tiberius (stiefzoon van Augustus) die een offer brengt, terwijl Victoria hem een lauwerkrans reikt. Aan de drie andere zijden staan Apollo, Diana en Ceres afgebeeld.</p>
<p>Het origineel is te zien in Museum het Valkhof. Op het Kelfkensbos staat een hedendaagse replica: de <em>Noviomagus-zuil</em> (2005), een Romeinse zonnewijzer van zwart graniet. De schaduw van de bronzen schildpad op de top wandelt langzaam over het plein — zijn vier poten staan voor de windrichtingen, zijn schild voor bescherming.</p>`,
    funFact: 'Noviomagus was de Latijnse naam voor Nijmegen. Het betekent zoiets als "nieuwe markt" of "nieuw veld".'

    id: 12,

function makeIcon(cat, num) {
  const color = CATS[cat].color;
  const html = `
    <div style="
      background:${color};
      width:28px; height:28px;
      border-radius:50% 50% 50% 0;
      transform:rotate(-45deg);
      border:2px solid rgba(255,255,255,0.85);
      box-shadow:0 2px 6px rgba(0,0,0,0.45);
      display:flex; align-items:center; justify-content:center;
    ">
      <span style="
        transform:rotate(45deg);
        color:white; font-size:9px; font-weight:bold;
        font-family:sans-serif; line-height:1;
        margin-top:-1px;
      ">${num}</span>
    </div>`;
  return L.divIcon({
    html,
    className: '',
    iconSize: [28, 28],
    iconAnchor: [14, 28],
    popupAnchor: [0, -30],
  });
}

highlights.forEach(h => {
  const marker = L.marker([h.lat, h.lng], { icon: makeIcon(h.cat, h.id) })
    .addTo(map)
    .bindPopup(`
      <div class="popup-inner">
        <span class="popup-cat">${CATS[h.cat].emoji} ${CATS[h.cat].label}</span>
        <strong>${h.id}. ${h.title}</strong>
        <span class="popup-hint">Klik voor meer informatie →</span>
      </div>
    `, { maxWidth: 220 });

  marker.on('click', () => {
    openPanel(h);
    map.panTo([h.lat, h.lng], { animate: true });
  });
});

// ─── PANEL ───────────────────────────────────────────────────────────────────
function openPanel(h) {
  document.getElementById('welcome').style.display = 'none';
  const detail = document.getElementById('detail');
  detail.style.display = 'block';

  document.getElementById('detailNumber').textContent = `Stop ${h.id} van ${highlights.length}`;

  const badge = document.getElementById('detailBadge');
  badge.textContent = `${CATS[h.cat].emoji} ${CATS[h.cat].label}`;
  badge.style.background = CATS[h.cat].color;

  document.getElementById('detailTitle').textContent = h.title;

  const img = document.getElementById('detailImage');
  const imgCap = document.getElementById('detailImageCaption');
  if (h.image) {
    img.src = h.image;
    img.alt = h.title;
    img.style.display = 'block';
    if (h.imageCaption) {
      imgCap.textContent = h.imageCaption;
      imgCap.style.display = 'block';
    } else {
      imgCap.style.display = 'none';
    }
  } else {
    img.style.display = 'none';
    imgCap.style.display = 'none';
  }

  document.getElementById('detailText').innerHTML = h.text;

  const ff = document.getElementById('detailFunFact');
  const fft = document.getElementById('detailFunFactText');
  if (h.funFact) {
    fft.textContent = h.funFact;
    ff.style.display = 'block';
  } else {
    ff.style.display = 'none';
  }

  // Scroll panel to top
  document.getElementById('panel').scrollTop = 0;
}

document.getElementById('panelClose').addEventListener('click', () => {
  document.getElementById('detail').style.display = 'none';
  document.getElementById('welcome').style.display = 'block';
  document.getElementById('panel').scrollTop = 0;
});
